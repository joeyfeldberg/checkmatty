[package]
name = "chess-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A polished terminal chess game with adaptive graphics"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
cozy-chess = "0.3.4"
crossterm = "0.29"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
thiserror = "2"
tiny-skia = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["poll", "process", "signal"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The raster compositor and image resamplers are unusably slow at opt-level 0.
# Keep debug assertions and symbols for the app while optimizing graphics-heavy
# dependencies so a normal `cargo run` remains interactive.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
